<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neutrix Lab is a remote digital studio for custom website design, brand identity, ecommerce stores, mobile apps, and web portals — serving UK, US, and worldwide clients." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#12141e" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Neutrix Lab" />
    <meta property="og:image" content="https://neutrixlab.com/og-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://neutrixlab.com/og-share.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Custom Websites, Branding &amp; Apps | Neutrix Lab</title>
    <script>
      (function () {
        try {
          var light = localStorage.getItem('neutrix-theme') === 'light'
          var root = document.documentElement
          root.classList.toggle('dark', !light)
          root.classList.toggle('theme-light', light)
          root.style.colorScheme = light ? 'light' : 'dark'
        } catch (e) {}
      })()
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
